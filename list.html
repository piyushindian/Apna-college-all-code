<!-- LISTS IN HTML
Unordered Lists -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS IN HTML</title>
</head>
<body>
    <h5>UNORDERED LISTS</h5>
    <ul>
        <li>Bread</li>
        <li>Jam</li>
        <li>Frooti</li>
        <li>Butter</li>
    </ul>
    <h5>ORDERED LISTS</h5>
    <ol type="">
        <li>Bread</li>
        <li>Jam</li>
        <li>Frooti</li>
        <li>Butter</li>
    </ol>
</body>
</html>
